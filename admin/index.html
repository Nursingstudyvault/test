<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nursing Study Vault Admin</title>
  <style>
    body{
      margin:0;
      font-family:Segoe UI,Arial,sans-serif;
      background:#f4f7fb;
    }
    .topbar{
      background:#1a73e8;
      color:#fff;
      padding:14px 18px;
      font-size:18px;
      font-weight:700;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
    }
    .welcome{
      max-width:900px;
      margin:25px auto 10px;
      background:#fff;
      padding:18px;
      border-radius:14px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }
    .welcome h1{
      margin:0 0 8px;
      color:#1a73e8;
      font-size:24px;
    }
    .welcome p{
      margin:0;
      color:#555;
      line-height:1.6;
    }
    .cms-box{
      max-width:1100px;
      margin:15px auto 40px;
      background:#fff;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>

  <div class="topbar">Nursing Study Vault Admin Panel</div>

  <div class="welcome">
    <h1>Admin Dashboard</h1>
    <p>
      Login ke baad yahan se aap Health Education, Health Talk, Assignment,
      Case Study, Nursing Care Plan, Procedure aur Family Folder posts add,
      edit, update aur delete kar sakte ho.
    </p>
  </div>

  <div class="cms-box">
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </div>

</body>
</html>
