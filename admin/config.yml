backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://nursingstudyvault.online
display_url: https://nursingstudyvault.online

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"

  - name: "health-talk"
    label: "Health Talks"
    folder: "health-talk"
    create: true
    slug: "{{slug}}"

    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"

      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }

      - label: "Body"
        name: "body"
        widget: "code"
        default_language: "html"
        output_code_only: true

