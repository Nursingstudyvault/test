backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://nursingstudyvault.online
display_url: https://nursingstudyvault.online

collections:
  - name: "health-talk"
    label: "Health Talks"
    folder: "health-talk"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Keywords", name: "keywords", widget: "string", required: false, hint: "Example: nursing care plan, health talk, GNM practical" }
      - { label: "Subject", name: "subject", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Permalink / Custom URL", name: "permalink", widget: "string", required: false, hint: "Example: /health-talk/personal-hygiene-health-talk/" }
      - { label: "Category", name: "category", widget: "hidden", default: "Health Talk" }
      - { label: "HTML Editor", name: "body", widget: "text", required: false }

