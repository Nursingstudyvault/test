backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "nursing_care_plan"
    label: "Nursing Care Plans"
    folder: "content/nursing-care-plan"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Reference", name: "reference", widget: "string", required: false }
      - label: "Body"
  name: "body"
  widget: "code"
  default_language: "html"
  output_code_only: true

  - name: "surgical_care_plan"
    label: "Surgical Care Plans"
    folder: "content/surgical-care-plan"
    create: true
    slug: "{{slug}}"
