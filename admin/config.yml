backend:
  name: git-gateway
  branch: version-2.1

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

collections:
  - name: "health_education"
    label: "Health Education"
    folder: "health-education"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Keywords", name: "keywords", widget: "text" }
      - { label: "Subject", name: "subject", widget: "string", default: "Community Health Nursing Practical" }
      - { label: "Permalink", name: "permalink", widget: "string", hint: "/health-education/slug.html" }
      - { label: "Canonical", name: "canonical", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Health Education"], default: "Health Education" }
      - { label: "Hide Related", name: "hideRelated", widget: "boolean", default: true }
      - { label: "Body HTML", name: "body", widget: "code", default_language: "html", allow_language_selection: false }

